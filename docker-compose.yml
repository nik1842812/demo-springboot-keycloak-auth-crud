services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo-db
      POSTGRES_USER: demo-user
      POSTGRES_PASSWORD: demo-pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    container_name: keycloak-demo
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
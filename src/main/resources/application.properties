spring.application.name=demo-keycloak
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/demo-db
spring.datasource.username=${DB_USERNAME:demo-user}
spring.datasource.password=${DB_PASSWORD:demo-pass}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions = true

keycloak.auth-server-url=http://localhost:8080
keycloak.realm=demo
keycloak.client-id=demo-client
keycloak.public-client=true
keycloak.grant-type=client_credentials
keycloak.client-secret=dtz9Iq3n2KwnmOlWLUNC3IlAWInAuaWS

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/demo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/demo/protocol/openid-connect/certs}
